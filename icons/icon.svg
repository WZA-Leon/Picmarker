<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <g transform="matrix(50,0,0,-50,350,350)" stroke="black" stroke-width="0.3" stroke-linejoin="round">
    <!-- 外框外围（天蓝色） -->
    <path d="M -6,-7 L 6,-7 A 1 1 0 0 1 7 -6 L 7 6 A 1 1 0 0 1 6 7 L -6 7 A 1 1 0 0 1 -7 6 L -7 -6 A 1 1 0 0 1 -6 -7 Z" fill="skyblue" />
    <!-- 外框内部（白色） -->
    <path d="M -5,-6 L 5,-6 A 1 1 0 0 1 6 -5 L 6 5 A 1 1 0 0 1 5 6 L -5 6 A 1 1 0 0 1 -6 5 L -6 -5 A 1 1 0 0 1 -5 -6 Z" fill="white" />
    <!-- 字母 M（宝蓝色） -->
    <path d="M 0.5,0 L 3.5,0 A 1 1 0 0 0 4.5 -1 L 4.5,-4 L 3.5,-4 L 3.5,-1 L 2.5,-1 L 2.5,-4 L 1.5,-4 L 1.5,-1 L 0.5,-1 L 0.5,-4 L -0.5,-4 L -0.5,-1 A 1 1 0 0 0 0.5 0 Z" fill="royalblue" />
    <!-- 字母 i 上部方块（红色） -->
    <path d="M -1.5,-0.5 L -1.5,-1.5 L -2.5,-1.5 L -2.5,-0.5 Z" fill="red" />
    <!-- 字母 i 下部竖条（黄色） -->
    <path d="M -1.5,-2 L -1.5,-4 L -2.5,-4 L -2.5,-2 Z" fill="yellow" />
    <!-- 字母 P 外框（宝蓝色） -->
    <path d="M -3.5,-4 L -3.5,0 L -1,0 A 0.5 0.5 0 0 1 -0.5 0.5 L -0.5,3 A 1 1 0 0 1 -1.5 4 L -3.5,4 A 1 1 0 0 1 -4.5 3 L -4.5,-4 Z" fill="royalblue" />
    <!-- 字母 P 内部留白（白色） -->
    <path d="M -1.5,1 L -1.5,3 L -3.5,3 L -3.5,1 Z" fill="white" />
    <!-- 字母 C（黄色） -->
    <path d="M 1,1 L 3,1 A 0.5 0.5 0 0 1 3.5 1.5 L 3.5,2 L 1.5,2 L 1.5,3 L 3.5,3 L 3.5,3.5 A 0.5 0.5 0 0 1 3 4 L 1,4 A 0.5 0.5 0 0 1 0.5 3.5 L 0.5,1.5 A 0.5 0.5 0 0 1 1 1 Z" fill="yellow" />
  </g>
</svg>